<section class="page stack">
  <div class="flex items-start justify-between gap-3">
    <div class="stack-sm">
      <p class="page-subtitle">Inbox</p>
      <h1 class="page-title">Alerts</h1>
    </div>
    <button type="button" class="btn-ghost !px-3 !py-2 text-sm" (click)="markAll()" [disabled]="busy()">
      Read all
    </button>
  </div>

  <button type="button" class="chip w-fit" (click)="toggleUnread()">
    {{ unreadOnly ? 'Showing unread' : 'Show unread only' }}
  </button>

  @if (loading()) {
    <div class="empty-state">Loading alerts…</div>
  } @else if (!items().length) {
    <div class="empty-state">You’re all caught up.</div>
  } @else {
    <div class="surface px-3">
      @for (item of items(); track item.id) {
        <button type="button" class="list-row w-full text-left" (click)="markRead(item)">
          <span class="min-w-0">
            <span class="flex items-center gap-2">
              <span class="font-medium text-ink">{{ item.title }}</span>
              @if (!item.isRead) {
                <span class="chip-accent !px-2 !py-0.5">New</span>
              }
            </span>
            <span class="hint block truncate">{{ item.body }}</span>
            <span class="hint">{{ item.createdAtUtc | date: 'medium' }}</span>
          </span>
          @if (item.relatedEntityId) {
            <a
              class="text-sm font-semibold"
              routerLink="/transactions"
              (click)="$event.stopPropagation()"
            >
              View
            </a>
          }
        </button>
      }
    </div>
  }
</section>
