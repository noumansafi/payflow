<form class="auth-card stack" [formGroup]="form" (ngSubmit)="submit()">
  <div class="stack-sm">
    <h1 class="page-title !text-xl">Sign in</h1>
    <p class="page-subtitle">Welcome back — use your PayFlow email and password.</p>
  </div>

  <label class="field">
    <span class="label">Email</span>
    <input class="input" type="email" formControlName="email" autocomplete="email" />
  </label>

  <label class="field">
    <span class="label">Password</span>
    <input class="input" type="password" formControlName="password" autocomplete="current-password" />
  </label>

  <button class="btn-primary btn-block" type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Signing in…' : 'Sign in' }}
  </button>

  <div class="flex items-center justify-between text-sm">
    <a routerLink="/forgot-password" class="font-semibold">Forgot password?</a>
    <a routerLink="/register" class="font-semibold">Create account</a>
  </div>
</form>
