@if (verifyToken(); as token) {
  <div class="surface stack p-5">
    <h1 class="page-title !text-xl">You’re almost in</h1>
    <p class="page-subtitle">
      In Development, PayFlow returns the email verification token here (mock email). Copy it or
      continue to verify.
    </p>
    <code class="rounded-xl bg-primary-soft p-3 text-xs break-all text-ink">{{ token }}</code>
    <button type="button" class="btn-primary btn-block" (click)="goVerify()">Verify email</button>
    <a routerLink="/login" class="btn-secondary btn-block text-center">Sign in</a>
  </div>
} @else {
  <form class="surface stack p-5" [formGroup]="form" (ngSubmit)="submit()">
    <div class="stack-sm">
      <h1 class="page-title !text-xl">Create account</h1>
      <p class="page-subtitle">We’ll also open a wallet for you automatically.</p>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <label class="field">
        <span class="label">First name</span>
        <input class="input" formControlName="firstName" autocomplete="given-name" />
      </label>
      <label class="field">
        <span class="label">Last name</span>
        <input class="input" formControlName="lastName" autocomplete="family-name" />
      </label>
    </div>

    <label class="field">
      <span class="label">Email</span>
      <input class="input" type="email" formControlName="email" autocomplete="email" />
    </label>

    <label class="field">
      <span class="label">Password</span>
      <input class="input" type="password" formControlName="password" autocomplete="new-password" />
      <span class="hint">At least 8 characters.</span>
    </label>

    <button class="btn-primary btn-block" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating…' : 'Create account' }}
    </button>

    <p class="text-center text-sm text-ink-muted">
      Already have an account?
      <a routerLink="/login" class="font-semibold">Sign in</a>
    </p>
  </form>
}
