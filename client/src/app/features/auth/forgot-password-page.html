@if (doneMessage(); as message) {
  <div class="auth-card stack">
    <div class="stack-sm">
      <p class="chip w-fit">Sent</p>
      <h1 class="page-title !text-xl">Check your inbox</h1>
      <p class="page-subtitle">{{ message }}</p>
    </div>
    <p class="rounded-xl bg-slate-50 px-3.5 py-3 text-xs text-ink-muted">
      Development tip: the mock email logger prints the reset token in the API console.
    </p>
    <a routerLink="/reset-password" class="btn-primary btn-block text-center">I have a token</a>
    <a routerLink="/login" class="btn-ghost btn-block text-center">Back to sign in</a>
  </div>
} @else {
  <form class="auth-card stack" [formGroup]="form" (ngSubmit)="submit()">
    <div class="stack-sm">
      <h1 class="page-title !text-xl">Forgot password</h1>
      <p class="page-subtitle">We’ll issue a reset token if the email exists.</p>
    </div>

    <label class="field">
      <span class="label">Email</span>
      <input class="input" type="email" formControlName="email" autocomplete="email" />
    </label>

    <button class="btn-primary btn-block" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Sending…' : 'Send reset link' }}
    </button>

    <a routerLink="/login" class="btn-ghost btn-block text-center">Back to sign in</a>
  </form>
}
