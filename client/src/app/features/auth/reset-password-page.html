<form class="auth-card stack" [formGroup]="form" (ngSubmit)="submit()">
  <div class="stack-sm">
    <h1 class="page-title !text-xl">Choose a new password</h1>
    <p class="page-subtitle">Paste the reset token from your email / API logs.</p>
  </div>

  <label class="field">
    <span class="label">Reset token</span>
    <textarea class="input min-h-24 font-mono text-xs" formControlName="token"></textarea>
  </label>

  <label class="field">
    <span class="label">New password</span>
    <input class="input" type="password" formControlName="newPassword" autocomplete="new-password" />
  </label>

  <button class="btn-primary btn-block" type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Updating…' : 'Update password' }}
  </button>

  <a routerLink="/login" class="btn-ghost btn-block text-center">Back to sign in</a>
</form>
