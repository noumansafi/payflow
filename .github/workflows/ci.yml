name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Restore
        run: dotnet restore PayFlow.sln

      - name: Build
        run: dotnet build PayFlow.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/PayFlow.Tests.Unit -c Release --no-build --verbosity normal

      - name: Integration tests
        run: dotnet test tests/PayFlow.Tests.Integration -c Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish src/PayFlow.Api/PayFlow.Api.csproj -c Release -o artifacts/api --no-restore

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: payflow-api
          path: artifacts/api
          if-no-files-found: error

      - name: Install Angular dependencies
        working-directory: client
        run: npm ci

      - name: Build Angular client
        working-directory: client
        run: npm run build -- --configuration=production

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: payflow-client
          path: client/dist
          if-no-files-found: error
